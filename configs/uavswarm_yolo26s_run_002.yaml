# Immutable parameter record for exp008 / run_002.
# It changes only the dataset YAML loading entry after run_001 exposed
# Ultralytics' process-cwd resolution of relative paths inside split text files.
task: detect
model: yolo26s.pt
data: ~/autodl-tmp/UAVSwarm-dataset-master/yolo26/UAVSwarm-yolo26.yaml
data_backend: selected_image_directories
epochs: 300
